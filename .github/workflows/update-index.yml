name: Update file index

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate README index
        run: |
          {
            echo "# coinflow"
            echo ""
            echo "Auto-generated index of every file in this repo, regenerated on each push by [.github/workflows/update-index.yml](.github/workflows/update-index.yml)."
            echo ""
            echo "| File | Last updated |"
            echo "|------|------|"
            git ls-files \
              | grep -v '^README\.md$' \
              | grep -v '^\.github/' \
              | sort \
              | while IFS= read -r f; do
                  updated=$(git log -1 --format=%cs -- "$f")
                  echo "| [$f]($f) | $updated |"
                done
          } > README.md

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Auto-update file index"
            git push
          fi
