name: Update file index

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - file-index.json
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build index
        run: node .github/scripts/build-index.mjs

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet -- README.md file-index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md file-index.json
            git commit -m "Auto-update file index"
            git push
          fi
